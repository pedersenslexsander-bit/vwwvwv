<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stone Merge Deluxe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar panel">
      <div>
        <div class="eyebrow">MERGE • UPGRADE • DISCOVER</div>
        <h1>STONE MERGE DELUXE</h1>
      </div>
      <div class="top-stats">
        <div class="stat"><span>Mynter</span><b id="coins">0</b></div>
        <div class="stat"><span>Beste</span><b id="bestStone">Gråstein</b></div>
        <div class="stat"><span>Prestisje</span><b id="prestige">0</b></div>
      </div>
    </header>

    <main class="layout">
      <section class="game panel">
        <div class="game-head">
          <div>
            <h2>Gruvebrettet</h2>
            <p>Åpne kasser, slå sammen to like steiner og bygg deg helt opp til den kosmiske kjernen.</p>
          </div>
          <button id="spawnButton" class="spawn-button">
            <span class="spawn-title">HAMRE ETTER KASSE</span>
            <span class="spawn-sub"><b id="presses">0</b>/5 trykk</span>
          </button>
        </div>

        <div class="meter"><span id="pressMeter"></span></div>

        <div id="board" class="board" aria-label="4 ganger 4 spillebrett"></div>

        <div class="board-actions">
          <button id="sellSelected" class="secondary" disabled>Selg valgt stein</button>
          <button id="autoMerge" class="secondary">Finn mulig merge</button>
          <button id="clearSelection" class="secondary">Fjern markering</button>
        </div>
      </section>

      <aside class="sidebar">
        <section class="panel side-card">
          <div class="side-title"><h3>Oppdrag</h3><span id="missionReward">+250</span></div>
          <div id="missions" class="missions"></div>
        </section>

        <section class="panel side-card">
          <div class="side-title"><h3>Butikk</h3><span>Oppgrader</span></div>
          <div class="shop">
            <button data-shop="luck"><span>Bedre flaks</span><b id="luckCost">300</b></button>
            <button data-shop="value"><span>Mer salgsverdi</span><b id="valueCost">450</b></button>
            <button data-shop="crate"><span>Startkasse +1 nivå</span><b id="crateCost">900</b></button>
          </div>
        </section>

        <section class="panel side-card">
          <div class="side-title"><h3>Steinbok</h3><span id="discoveredCount">0/12</span></div>
          <div id="collection" class="collection"></div>
        </section>

        <section class="panel side-card compact">
          <div class="side-title"><h3>Spill</h3><span>Autosave</span></div>
          <div class="button-grid">
            <button id="prestigeButton" class="gold">Prestisje</button>
            <button id="resetButton" class="danger">Nullstill</button>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="game.js"></script>
</body>
</html>
